<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- TAVI Logo Mark: A minimal T-shape with connected financial paths -->
  <rect width="32" height="32" rx="8" fill="#047857"/>
  <!-- T-bar top -->
  <rect x="6" y="8" width="20" height="4" rx="2" fill="#A7F3D0"/>
  <!-- T-stem -->
  <rect x="13" y="12" width="6" height="10" rx="1.5" fill="#A7F3D0"/>
  <!-- Connection dots suggesting movement/paths -->
  <circle cx="8" cy="24" r="2.5" fill="#10B981"/>
  <circle cx="16" cy="24" r="2.5" fill="#10B981"/>
  <circle cx="24" cy="24" r="2.5" fill="#10B981"/>
  <!-- Connecting lines -->
  <line x1="10.5" y1="24" x2="13.5" y2="24" stroke="#10B981" stroke-width="1.5"/>
  <line x1="18.5" y1="24" x2="21.5" y2="24" stroke="#10B981" stroke-width="1.5"/>
</svg>
